<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>كتالوج الطلب</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img id="logo" alt="" hidden>
  <div><div class="brand" id="brand"></div><div class="sub" id="tagline"></div></div>
</header>
<main class="container">
  <div class="offer" id="offer" hidden></div>
  <div class="tools">
    <input id="search" type="search" placeholder="ابحث عن منتج..." aria-label="بحث">
    <div class="chips" id="chips"></div>
  </div>
  <p id="status" class="status">جاري التحميل...</p>
  <section class="grid" id="grid"></section>
</main>
<button id="cartBtn" class="cartbtn" hidden></button>
<div id="panel" class="panel">
  <div class="sheet">
    <button id="closePanel" class="x" aria-label="إغلاق">×</button>
    <h3>مراجعة الطلب</h3>
    <div id="lines"></div>
    <div class="total">الإجمالي: <span id="total"></span></div>
    <form id="form" onsubmit="return false"></form>
  </div>
</div>
<div id="zoom" class="zoom"><img id="zimg" alt=""><div id="zname"></div></div>
<script src="app.js"></script>
</body>
</html>
